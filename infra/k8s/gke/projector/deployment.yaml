apiVersion: apps/v1
kind: Deployment
metadata:
  name: projector
  namespace: null-realm
  labels:
    app: projector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: projector
  template:
    metadata:
      labels:
        app: projector
    spec:
      containers:
        - name: projector
          image: europe-west1-docker.pkg.dev/YOUR_GCP_PROJECT/null-realm/projector:latest
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: null-realm-db
                  key: database-url
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
