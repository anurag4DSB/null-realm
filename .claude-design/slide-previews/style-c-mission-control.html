<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style C — Mission Control</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #06060c;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  .slide {
    width: 960px; height: 540px;
    background: #06060c;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 60px 80px;
  }
  /* Cyan grid */
  .slide::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.06) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridPulse 4s ease-in-out infinite alternate;
  }
  /* Scanline */
  .slide::after {
    content: '';
    position: absolute;
    top: -100%;
    left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(0,229,255,0.4), transparent);
    animation: scanline 3s linear infinite 1s;
  }
  /* Matrix rain canvas */
  .matrix { position: absolute; inset: 0; opacity: 0.12; }
  .status-bar {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: #ffab00;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 20px;
    position: relative;
    z-index: 1;
    opacity: 0;
    animation: typeIn 0.6s steps(20) forwards 0.5s;
  }
  .status-bar::before { content: '> '; color: #00e5ff; }
  .title {
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: 54px;
    line-height: 1.1;
    color: #fff;
    position: relative;
    z-index: 1;
    opacity: 0;
    animation: glitchIn 0.8s ease forwards 0.9s;
  }
  .title span { color: #00e5ff; }
  .rule {
    width: 0;
    height: 1px;
    background: linear-gradient(90deg, #00e5ff, #ffab00, transparent);
    margin: 24px 0;
    position: relative;
    z-index: 1;
    animation: growLine 0.6s ease forwards 1.5s;
  }
  .subtitle {
    font-family: 'Outfit', sans-serif;
    font-weight: 300;
    font-size: 22px;
    color: rgba(255,255,255,0.7);
    position: relative;
    z-index: 1;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 1.8s;
  }
  .byline {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: #00e5ff;
    margin-top: 16px;
    position: relative;
    z-index: 1;
    opacity: 0;
    animation: fadeUp 0.5s ease forwards 2.1s;
  }
  .byline::before { content: '$ '; color: #ffab00; }
  .corner-glyph {
    position: absolute;
    bottom: 30px; right: 40px;
    width: 40px; height: 40px;
    border-right: 2px solid #00e5ff;
    border-bottom: 2px solid #00e5ff;
    opacity: 0;
    animation: fadeIn 0.8s ease forwards 2.4s;
  }
  @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes glitchIn {
    0%   { opacity:0; transform:translateX(-8px); clip-path:inset(0 100% 0 0); }
    60%  { opacity:1; transform:translateX(2px); clip-path:inset(0 0 0 0); }
    80%  { transform:translateX(-1px); }
    100% { opacity:1; transform:translateX(0); }
  }
  @keyframes typeIn { from { opacity:0; width:0; } to { opacity:1; width:auto; } }
  @keyframes growLine { from { width:0; } to { width:320px; } }
  @keyframes scanline { from { top:-2px; } to { top:102%; } }
  @keyframes gridPulse { from { opacity:1; } to { opacity:0.5; } }
</style>
</head>
<body>
  <div class="slide">
    <canvas class="matrix" id="matrix"></canvas>
    <div class="status-bar">sys.init &mdash; kubecon.2026 // mission_control v3.1</div>
    <div class="title">From KubeCon<br>to <span>Production</span></div>
    <div class="rule"></div>
    <div class="subtitle">The Future of Developer Experience</div>
    <div class="byline">anurag.mittal@scality</div>
    <div class="corner-glyph"></div>
  </div>
  <script>
    const c = document.getElementById('matrix');
    const ctx = c.getContext('2d');
    c.width = 960; c.height = 540;
    const cols = Math.floor(c.width / 18);
    const drops = Array(cols).fill(1);
    const chars = 'kubectl apply -f deploy.yaml pod/ready 1/1 Running CNCF'.split('');
    function draw() {
      ctx.fillStyle = 'rgba(6,6,12,0.15)';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.fillStyle = '#00e5ff';
      ctx.font = '13px JetBrains Mono, monospace';
      for (let i = 0; i < drops.length; i++) {
        const ch = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(ch, i * 18, drops[i] * 18);
        if (drops[i] * 18 > c.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(draw, 60);
  </script>
</body>
</html>
