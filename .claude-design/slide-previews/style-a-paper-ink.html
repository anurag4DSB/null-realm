<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style A — Paper &amp; Ink</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #faf9f7;
    color: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Source Serif 4', Georgia, serif;
    overflow: hidden;
  }
  .slide {
    width: 960px; height: 540px;
    background: #faf9f7;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 80px 100px;
    position: relative;
    border: 1px solid #e8e4de;
    box-shadow: 0 2px 40px rgba(0,0,0,0.06);
  }
  .title {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 700;
    font-size: 52px;
    line-height: 1.15;
    letter-spacing: -0.5px;
    opacity: 0;
    animation: fadeUp 1s ease forwards 0.3s;
  }
  .title .drop-cap {
    font-size: 80px;
    float: left;
    line-height: 0.85;
    margin-right: 4px;
    color: #c41e3a;
    font-weight: 700;
  }
  .rule {
    width: 0;
    height: 2px;
    background: linear-gradient(90deg, #c41e3a 40%, #e8e4de 100%);
    margin: 28px 0;
    animation: growLine 0.8s ease forwards 1s;
  }
  .subtitle {
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 300;
    font-size: 22px;
    color: #555;
    letter-spacing: 0.3px;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 1.4s;
  }
  .byline {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 600;
    font-style: italic;
    font-size: 18px;
    color: #c41e3a;
    margin-top: 16px;
    opacity: 0;
    animation: fadeUp 0.7s ease forwards 1.8s;
  }
  .corner-mark {
    position: absolute;
    bottom: 36px;
    right: 48px;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 12px;
    color: #bbb;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeIn 1s ease forwards 2.2s;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes growLine {
    from { width: 0; }
    to   { width: 180px; }
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="title">
      <span class="drop-cap">F</span>rom KubeCon<br>to Production
    </div>
    <div class="rule"></div>
    <div class="subtitle">The Future of Developer Experience</div>
    <div class="byline">Anurag Mittal &mdash; Scality</div>
    <div class="corner-mark">KubeCon 2026</div>
  </div>
</body>
</html>
