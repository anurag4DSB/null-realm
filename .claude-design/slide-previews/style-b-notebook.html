<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style B — Notebook Tabs</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #2d2d2d;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  .slide {
    width: 960px; height: 540px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .paper {
    width: 820px; height: 480px;
    background: #f8f6f1;
    border-radius: 4px 12px 12px 4px;
    box-shadow: 4px 6px 30px rgba(0,0,0,0.35), 1px 1px 0 #e8e5dd;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 60px 90px 60px 80px;
    opacity: 0;
    animation: paperIn 0.7s ease forwards 0.2s;
  }
  /* Binder holes */
  .paper::before {
    content: '';
    position: absolute;
    left: 30px; top: 60px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #2d2d2d;
    box-shadow:
      0 120px 0 #2d2d2d,
      0 240px 0 #2d2d2d,
      0 340px 0 #2d2d2d;
  }
  /* Red margin line */
  .paper::after {
    content: '';
    position: absolute;
    left: 56px; top: 0; bottom: 0;
    width: 1.5px;
    background: #e6aaaa;
    opacity: 0.5;
  }
  /* Tabs on right edge */
  .tabs {
    position: absolute;
    right: -22px; top: 40px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .tab {
    width: 22px;
    border-radius: 0 6px 6px 0;
    opacity: 0;
    animation: tabIn 0.4s ease forwards;
  }
  .tab:nth-child(1) { height: 80px; background: #98d4bb; animation-delay: 0.8s; }
  .tab:nth-child(2) { height: 80px; background: #c7b8ea; animation-delay: 1.0s; }
  .tab:nth-child(3) { height: 80px; background: #f4b8c5; animation-delay: 1.2s; }
  .tab:nth-child(4) { height: 80px; background: #a8d8ea; animation-delay: 1.4s; }
  .title {
    font-family: 'Bodoni Moda', Georgia, serif;
    font-weight: 900;
    font-size: 46px;
    line-height: 1.1;
    color: #1a1a1a;
    margin-left: 24px;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.7s;
  }
  .title em { color: #7a5ea7; font-style: normal; }
  .divider {
    width: 60px; height: 4px;
    background: #98d4bb;
    border-radius: 2px;
    margin: 22px 0 22px 24px;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 1.1s;
  }
  .subtitle {
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    font-size: 20px;
    color: #555;
    margin-left: 24px;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 1.3s;
  }
  .byline {
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: 15px;
    color: #1a1a1a;
    margin: 14px 0 0 24px;
    padding: 6px 16px;
    background: #f4b8c5;
    border-radius: 4px;
    display: inline-block;
    opacity: 0;
    animation: fadeUp 0.5s ease forwards 1.6s;
  }
  @keyframes paperIn {
    from { opacity: 0; transform: translateY(30px) rotate(-1deg); }
    to   { opacity: 1; transform: translateY(0) rotate(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes tabIn {
    from { opacity: 0; transform: translateX(-10px); }
    to   { opacity: 1; transform: translateX(0); }
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="paper">
      <div class="tabs">
        <div class="tab"></div>
        <div class="tab"></div>
        <div class="tab"></div>
        <div class="tab"></div>
      </div>
      <div class="title">From KubeCon<br>to <em>Production</em></div>
      <div class="divider"></div>
      <div class="subtitle">The Future of Developer Experience</div>
      <div class="byline">Anurag Mittal @ Scality</div>
    </div>
  </div>
</body>
</html>
